name: Build and upload v1.5.0 installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            windows-app/package-lock.json

      - name: Install application dependencies
        shell: pwsh
        run: |
          npm install --global pnpm@10
          npm ci
          npm install --prefix windows-app --no-audit --no-fund

      - name: Build embedded application
        shell: pwsh
        run: npx vinext build

      - name: Build Windows installer
        shell: pwsh
        run: npm run dist --prefix windows-app

      - name: Verify consistency review gate
        shell: pwsh
        run: node --test tests/consistency-gate.test.mjs

      - name: Upload fixed installers to v1.5.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -LiteralPath "windows-app/release" -Filter "*x64.exe" |
            Where-Object { $_.Name -notlike "*uninstaller*" } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not generated." }
          $projectAssets = Join-Path $installer.DirectoryName "manjing-1.5.0-project-assets-x64.exe"
          $latest = Join-Path $installer.DirectoryName "manjing-1.5.0-latest-x64.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $projectAssets -Force
          Copy-Item -LiteralPath $installer.FullName -Destination $latest -Force
          gh release upload v1.5.0 $projectAssets $latest --clobber
